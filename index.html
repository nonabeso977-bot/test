<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#edf3f8">
<title>مسوّدة | دفتر السكربتات</title>
<style>
:root{--bg:#edf3f8;--paper:#fff;--ink:#243447;--muted:#718096;--line:#dce6ef;--blue:#477da8;--blue2:#e8f1f8;--shadow:0 12px 35px #28435c12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}
.app{max-width:1440px;margin:auto;padding:22px;min-height:100vh;display:grid;grid-template-columns:310px minmax(0,1fr);gap:20px}
.sidebar,.workspace{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.sidebar{padding:22px;display:flex;flex-direction:column;gap:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:43px;height:43px;border-radius:14px;background:var(--blue2);display:grid;place-items:center;color:var(--blue);font-size:23px}.brand h1{font-size:21px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:5px 0 0}
.new{background:var(--blue);color:white;padding:13px 16px;border-radius:13px;font-weight:bold}.search{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fbfdff;outline:none}.search:focus,.field:focus,.editor:focus{border-color:#8bb3d1;box-shadow:0 0 0 3px #477da815}.section-label{font-size:11px;color:var(--muted);font-weight:bold;letter-spacing:.4px;margin:4px 0}.filters{display:grid;gap:5px}.filter{background:transparent;text-align:right;padding:10px 12px;border-radius:10px;color:#526477;display:flex;justify-content:space-between}.filter.active,.filter:hover{background:var(--blue2);color:var(--blue);font-weight:bold}.count{font-size:11px;color:var(--muted)}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:15px;color:var(--muted);font-size:11px;line-height:1.8}
.workspace{padding:26px;min-width:0;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.eyebrow{color:var(--blue);font-size:12px;font-weight:bold;margin-bottom:7px}.top h2{margin:0;font-size:25px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.ghost{background:#f4f7fa;color:#526477;padding:10px 13px;border-radius:11px}.ghost:hover{background:var(--blue2);color:var(--blue)}
.layout{display:grid;grid-template-columns:minmax(230px,.78fr) minmax(0,1.4fr);gap:18px;flex:1;min-height:550px}.notes-panel,.editor-panel{border:1px solid var(--line);border-radius:17px;min-width:0}.notes-panel{padding:15px;background:#fbfdff}.list-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.list-head strong{font-size:13px}.list-head span{font-size:11px;color:var(--muted)}.notes-list{display:grid;gap:8px;max-height:calc(100vh - 250px);overflow:auto}.note-card{width:100%;text-align:right;background:white;border:1px solid var(--line);border-radius:12px;padding:13px;color:var(--ink)}.note-card.active{border-color:#8bb3d1;background:#f1f7fb}.note-card h3{font-size:13px;margin:0 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note-card p{font-size:11px;color:var(--muted);line-height:1.6;margin:0 0 9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:10px}.tag{background:var(--blue2);color:var(--blue);padding:4px 7px;border-radius:20px}
.editor-panel{padding:22px;display:flex;flex-direction:column;gap:13px}.editor-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.save-state{font-size:11px;color:#55836b}.field{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff;color:var(--ink);outline:none}.title-field{font-size:20px;font-weight:bold;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 2px 13px}.row-fields{display:flex;gap:9px}.row-fields>*{flex:1;min-width:0}.editor{width:100%;min-height:310px;flex:1;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:16px;line-height:2;background:#fff;color:var(--ink);outline:none;font-size:14px}.editor::placeholder{color:#9aa9b7}.editor-footer{display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--muted);font-size:11px}.danger{background:#fff1f0;color:#b45b56;padding:9px 12px;border-radius:10px}.empty{padding:25px 12px;text-align:center;color:var(--muted);font-size:12px;line-height:1.8}.empty-icon{font-size:26px;margin-bottom:8px}.hint{font-size:11px;color:var(--muted);line-height:1.8}
@media(max-width:850px){.app{grid-template-columns:1fr;padding:12px}.sidebar{gap:12px}.filters{display:flex;flex-wrap:wrap}.filter{padding:8px 10px}.side-bottom{display:none}.layout{grid-template-columns:1fr;min-height:0}.notes-list{display:flex;overflow-x:auto;max-height:none;padding-bottom:5px}.note-card{min-width:185px}.editor-panel{min-height:510px}.workspace{padding:16px}.top h2{font-size:21px}}@media(max-width:430px){.top{align-items:flex-start;flex-direction:column}.row-fields{flex-direction:column}.editor-panel{padding:15px}.editor{min-height:280px}}
</style></head>
<body><div class="app">
<aside class="sidebar"><div class="brand"><div class="logo">✎</div><div><h1>مسوّدة</h1><p>مساحة هادئة للأفكار والسكربتات</p></div></div>
<button class="new" id="newNote">＋ مسودة جديدة</button><input class="search" id="search" placeholder="البحث في العناوين والنصوص..." aria-label="بحث">
<div><div class="section-label">المكتبة</div><div class="filters" id="filters">
<button class="filter active" data-filter="all">كل المذكرات <span class="count" id="allCount">0</span></button><button class="filter" data-filter="script">السكربتات <span class="count" id="scriptCount">0</span></button><button class="filter" data-filter="idea">أفكار أولية <span class="count" id="ideaCount">0</span></button><button class="filter" data-filter="research">بحث ومصادر <span class="count" id="researchCount">0</span></button></div></div>
<div class="side-bottom">مذكراتك تُحفظ تلقائيًا على هذا الجهاز والمتصفح.<br>لا حسابات، لا إعلانات، ولا مزاحمة على انتباهك.</div></aside>
<main class="workspace"><header class="top"><div><div class="eyebrow">دفتر الكتابة</div><h2 id="pageTitle">كل المذكرات</h2></div><div class="top-actions"><button class="ghost" id="exportAll">تصدير الكل</button><button class="ghost" id="exportOne">تنزيل المذكرة</button></div></header>
<section class="layout"><div class="notes-panel"><div class="list-head"><strong>المسودات</strong><span id="visibleCount">0 مذكرة</span></div><div class="notes-list" id="notesList"></div></div>
<section class="editor-panel"><div class="editor-head"><span class="section-label">مساحة التحرير</span><span class="save-state" id="saveState">جاهز</span></div>
<input class="field title-field" id="noteTitle" placeholder="عنوان المذكرة..." maxlength="120">
<div class="row-fields"><select class="field" id="noteType" aria-label="نوع المذكرة"><option value="script">سكربت</option><option value="idea">فكرة أولية</option><option value="research">بحث ومصادر</option></select><select class="field" id="noteStatus" aria-label="حالة المذكرة"><option value="draft">مسودة</option><option value="working">قيد العمل</option><option value="ready">جاهزة للتسجيل</option></select></div>
<textarea class="editor" id="noteBody" placeholder="مساحة الكتابة...

ترتيب مقترح للسكربتات الطويلة:
• الافتتاحية / الخطّاف
• الفكرة الرئيسية
• المحاور والانتقالات
• الأمثلة والحكايات
• المعلومات التي تحتاج إلى تحقق
• الخاتمة والسؤال الذي تتركينه للمشاهد

تُكتب الأفكار بحرية، ويمكن تأجيل المراجعة إلى مرحلة لاحقة."></textarea>
<div class="editor-footer"><span id="wordCount">0 كلمة</span><button class="danger" id="deleteNote">حذف المذكرة</button></div><div class="hint">تُحفظ التعديلات تلقائيًا. يمكن تنزيل المذكرة للاحتفاظ بنسخة نصية خارج التطبيق.</div></section></section></main></div>
<script>
const KEY='maswada_script_notes_v1', $=id=>document.getElementById(id), typeNames={script:'سكربت',idea:'فكرة',research:'بحث'},statusNames={draft:'مسودة',working:'قيد العمل',ready:'جاهزة للتسجيل'};
let notes=[],selected=null,filter='all',query='';
try{notes=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(notes))notes=[]}catch{notes=[]}
function uid(){return 'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function persist(){localStorage.setItem(KEY,JSON.stringify(notes));$('saveState').textContent='تم الحفظ تلقائيًا';renderList();renderCounts()}
function current(){return notes.find(n=>n.id===selected)}
function createNote(){const n={id:uid(),title:'مسودة جديدة',type:'script',status:'draft',body:'',updated:Date.now()};notes.unshift(n);selected=n.id;persist();loadEditor();$('noteTitle').focus()}
function loadEditor(){const n=current(),disabled=!n;['noteTitle','noteType','noteStatus','noteBody','deleteNote','exportOne'].forEach(id=>$(id).disabled=disabled);if(!n){$('noteTitle').value='';$('noteType').value='script';$('noteStatus').value='draft';$('noteBody').value='';$('saveState').textContent='لا توجد مذكرة محددة';$('wordCount').textContent='0 كلمة';return}$('noteTitle').value=n.title;$('noteType').value=n.type;$('noteStatus').value=n.status;$('noteBody').value=n.body;$('saveState').textContent='تم الحفظ';wordCount();renderList()}
function wordCount(){const t=$('noteBody').value.trim(),count=t?t.split(/\s+/).length:0;$('wordCount').textContent=count+' كلمة · '+$('noteBody').value.length+' حرف'}
function renderCounts(){$('allCount').textContent=notes.length;$('scriptCount').textContent=notes.filter(n=>n.type==='script').length;$('ideaCount').textContent=notes.filter(n=>n.type==='idea').length;$('researchCount').textContent=notes.filter(n=>n.type==='research').length}
function renderList(){const list=notes.filter(n=>(filter==='all'||n.type===filter)&&(!query||(n.title+' '+n.body).toLowerCase().includes(query)));$('visibleCount').textContent=list.length+' مذكرة';$('notesList').innerHTML='';if(!list.length){$('notesList').innerHTML='<div class="empty"><div class="empty-icon">▤</div>لا توجد مذكرات هنا بعد.<br>لا توجد مذكرات بعد. يمكن إنشاء مسودة جديدة.</div>';return}for(const n of list){const b=document.createElement('button');b.className='note-card'+(n.id===selected?' active':'');const title=document.createElement('h3');title.textContent=n.title||'بلا عنوان';const preview=document.createElement('p');preview.textContent=n.body||'لا يوجد نص بعد';const meta=document.createElement('div');meta.className='meta';const tag=document.createElement('span');tag.className='tag';tag.textContent=typeNames[n.type];const date=document.createElement('span');date.textContent=new Date(n.updated).toLocaleDateString('ar');meta.append(tag,date);b.append(title,preview,meta);b.onclick=()=>{selected=n.id;loadEditor()};$('notesList').append(b)}}
function saveFromEditor(){const n=current();if(!n)return;n.title=$('noteTitle').value.trim()||'بلا عنوان';n.type=$('noteType').value;n.status=$('noteStatus').value;n.body=$('noteBody').value;n.updated=Date.now();wordCount();persist()}
function download(name,text){const blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
function safeName(s){return(s||'مذكرة').replace(/[\\/:*?"<>|]/g,'-').slice(0,70)}
function exportOne(){const n=current();if(!n)return;const content='العنوان: '+n.title+'\nالنوع: '+typeNames[n.type]+'\nالحالة: '+statusNames[n.status]+'\n\n'+n.body;download(safeName(n.title)+'.txt',content)}
$('newNote').onclick=createNote;$('noteTitle').oninput=saveFromEditor;$('noteType').onchange=saveFromEditor;$('noteStatus').onchange=saveFromEditor;$('noteBody').oninput=saveFromEditor;$('search').oninput=e=>{query=e.target.value.toLowerCase();renderList()};
$('filters').onclick=e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));$('pageTitle').textContent=({all:'كل المذكرات',script:'السكربتات',idea:'الأفكار الأولية',research:'البحث والمصادر'})[filter];renderList()};
$('deleteNote').onclick=()=>{if(!current()||!confirm('حذف هذه المذكرة نهائيًا من هذا المتصفح؟'))return;notes=notes.filter(x=>x.id!==selected);selected=notes[0]?.id||null;persist();loadEditor()};
$('exportOne').onclick=exportOne;$('exportAll').onclick=()=>{const data=notes.map(n=>'# '+n.title+'\nالنوع: '+typeNames[n.type]+' | الحالة: '+statusNames[n.status]+'\n\n'+n.body+'\n\n--------------------\n').join('\n');download('كل-المذكرات.txt',data||'لا توجد مذكرات')};
if(notes.length){selected=notes[0].id;loadEditor()}else{loadEditor();renderList()}renderCounts();
</script></body></html>
